# matrix-appservice-nostr configuration.
#
# Only the settings you need to start are here. Every setting is described
# in CONFIG.md.

bridge:
  # The domain Nostr handles live under: an ID named "alice" is
  # alice@<domain>. It doesn't have to be your homeserver's server_name, but
  # its web server must proxy /.well-known/nostr.json to this bridge (see
  # deploy/nginx.conf.example). Handles can be moved later without losing
  # followers, but old handles stop working unless the old domain keeps
  # proxying that path.
  domain: example.org

  # Host/port the bridge's own HTTP server binds to.
  listen_host: 127.0.0.1
  listen_port: 8092

  # Matrix users who are bridge admins.
  admins: []
  #  - "@you:example.org"

homeserver:
  # Client-Server API base URL, as reachable from the bridge process. Any
  # spec-compliant homeserver works.
  base_url: http://localhost:8008
  # The homeserver's server_name (the part after the colon in @user:server.name).
  server_name: example.org

appservice:
  # Where `python -m bridge.appservice` writes the registration file, which
  # you then register with your homeserver (INSTALL.md).
  registration_path: ./appservice-registration.yaml
  id: matrix-appservice-nostr
  # Shared secrets you generate yourself (scripts/setup.sh does): long,
  # random, and different from each other.
  hs_token: "hs_replace_me"
  as_token: "as_replace_me"
  # Commands start with this: "[help". Must differ from any other bot in the
  # same rooms (matrix-appservice-activitypub uses ";", matrix-appservice-atproto "]").
  command_prefix: "["

storage:
  # "sqlite" (a single file under data_dir) or "postgresql" (see CONFIG.md).
  backend: sqlite
  data_dir: ./data

nostr:
  # The bridge's own relay, as Nostr clients reach it. Its NIP-11 document
  # and media are served from the same host.
  relay_url: wss://nostr.example.org
  # Encrypts every Nostr secret key the bridge holds. Generated by
  # scripts/setup.sh. Back it up with the database: without it, the keys
  # in the database are useless, and those identities are lost.
  key_encryption_secret: "key_secret_replace_me"

logging:
  level: INFO
